<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>F.Y.E.O — Zero-Yield Visual AEAD & Chameleon Document Vault</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="You cannot stop attackers from breaching the perimeter, but you can deceive them into stealing harmless UI pixels. Zero-Yield Chameleon Stego-AEAD Document Vault for Java & Spring Boot. Java for the Street 🛣️☕️">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Modern Clean Theme with Emerald Accent -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  
  <style>
    :root {
      --theme-color: #10b981;
      --base-font-size: 15px;
      --sidebar-width: 280px;
      --code-font-family: 'JetBrains Mono', 'Fira Code', monospace;
      --heading-color: #f8fafc;
      --link-color: #34d399;
      --sidebar-name-color: #10b981;
      --sidebar-nav-link-color--active: #10b981;
      --notice-tip-border-color: #10b981;
    }
    
    .app-name-link img {
      width: 42px;
      vertical-align: middle;
      margin-right: 8px;
    }

    .markdown-section pre {
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
    }

    .sidebar-nav strong {
      color: #94a3b8;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div id="app">Loading F.Y.E.O Documentation...</div>
  <script>
    window.$docsify = {
      name: '🛡️ F.Y.E.O Vault',
      repo: 'https://github.com/Mosh-py/fyeo-ecosystem',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search documentation...',
        noData: 'No results found',
        depth: 6
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true
      }
    }
  </script>
  <!-- Docsify v4 Core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <!-- Prism Syntax Highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-groovy.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
</body>
</html>
